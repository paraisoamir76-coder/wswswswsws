<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kashmir — Demo Reel</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpg" href="favicon.jpg">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">KP</a>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="reel.html" class="active">Reel</a></li>
      <li><a href="contact.html" class="nav-cta">Hire Me</a></li>
    </ul>
    <button class="burger" id="burger">&#9776;</button>
  </nav>

  <div class="drawer" id="drawer">
    <ul>
      <li><a href="index.html"   onclick="closeDrawer()">About</a></li>
      <li><a href="skills.html"  onclick="closeDrawer()">Skills</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="projects.html" onclick="closeDrawer()">Projects</a></li>
      <li><a href="reel.html"    onclick="closeDrawer()">Reel</a></li>
      <li><a href="contact.html" onclick="closeDrawer()">Hire Me</a></li>
    </ul>
  </div>

  <div class="page">
    <div class="reel-body">
      <p class="section-tag fade-in">Demo Reel</p>
      <h2 class="fade-in">In <em>Motion</em></h2>

  <div class="video-wrap fade-in">
  <video autoplay muted loop playsinline controls style="width: 100%; height: 100%; object-fit: cover;">
    <source src="demoreel.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  </div>

      <footer class="footer">
        <span>© 2026 Kashmir</span>
      </footer>
    </div>
  </div>

  <script>
    const burger = document.getElementById('burger');
    const drawer = document.getElementById('drawer');
    burger.addEventListener('click', () => drawer.classList.toggle('open'));
    function closeDrawer() { drawer.classList.remove('open'); }

    document.querySelectorAll('.fade-in').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), 80 + i * 130);
    });
  </script>
</body>
</html>
